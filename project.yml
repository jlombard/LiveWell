# Generates LiveWell.xcodeproj. Run `xcodegen` in this folder after changing this file.
# Before the first build, set the three values marked CHANGE.
name: LiveWell
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""                 # CHANGE: your Apple developer Team ID
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  LiveWellCore:
    path: Packages/LiveWellCore
targets:
  LiveWell:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: LiveWellCore
      - target: LiveWellWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.livewell          # CHANGE
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LiveWell
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [InstrumentSerif-Regular.ttf, InstrumentSerif-Italic.ttf]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [livewell.refresh]
        NSHealthShareUsageDescription: LiveWell reads your workouts, Exercise minutes, VO2 max, weight and sleep to keep your dashboard current.
        NSHealthUpdateUsageDescription: LiveWell saves a workout to Health when you log a lift, row or yoga session by hand.
        CFBundleURLTypes:
          - CFBundleURLName: livewell
            CFBundleURLSchemes: [livewell]
    entitlements:
      path: App/LiveWell.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.livewell.shared]   # CHANGE with Shared/AppGroup.swift
  LiveWellWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: LiveWellCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.livewell.widget   # CHANGE (app id + .widget)
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: LiveWell
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/LiveWellWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.livewell.shared]
